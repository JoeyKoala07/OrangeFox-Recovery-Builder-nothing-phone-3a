name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox / sync branch'
        required: true
        default: '12.1'
        type: choice
        options: [ "12.1", "11.0" ]

      DEVICE_TREE:
        description: 'Device tree repo URL'
        required: true
        default: 'https://github.com/JoeyKoala07/android_device_nothing_Asteroids'

      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'Asteroids-user-14-UKQ1.241011.001-2507171803-release-keys'

      DEVICE_PATH:
        description: 'Device path under AOSP root'
        required: true
        default: 'device/nothing/Asteroids'

      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'Asteroids'

      BUILD_TARGET:
        description: 'Image target to build'
        required: true
        default: 'recovery'
        type: choice
        options: [ "boot", "recovery", "vendorboot" ]

      LDCHECK:
        description: 'LDCheck: path of blobs to check'
        required: false
        default: 'system/bin/qseecomd'

      RECOVERY_TAR:
        description: 'Also create *.tar (Samsung Odin)'
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display Inputs
        shell: bash
        run: |
          echo "::group::Inputs"
          echo "MANIFEST_BRANCH         = ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "DEVICE_TREE             = ${{ github.event.inputs.DEVICE_TREE }}"
          echo "DEVICE_TREE_BRANCH      = ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "DEVICE_PATH             = ${{ github.event.inputs.DEVICE_PATH }}"
          echo "DEVICE_NAME             = ${{ github.event.inputs.DEVICE_NAME }}"
          echo "BUILD_TARGET            = ${{ github.event.inputs.BUILD_TARGET }}"
          echo "RECOVERY_INSTALLER      = ${{ github.event.inputs.RECOVERY_INSTALLER }}"
          echo "RECOVERY_TAR            = ${{ github.event.inputs.RECOVERY_TAR }}"
          echo "::endgroup::"

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build Environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Set-up Manifest
        if: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"
          git config --global user.name  "Pantelis"
          git config --global user.email "rimurum@pm.me"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh \
            --branch "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            --path   "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"

      # ---------- FIXED: clone device tree correctly ----------
      - name: Clone Device Tree
        working-directory: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "${{ github.event.inputs.DEVICE_PATH }}")"
          rm -rf  "${{ github.event.inputs.DEVICE_PATH }}"
          git clone --depth=1 \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_TREE }}" \
            "${{ github.event.inputs.DEVICE_PATH }}"
          cd "${{ github.event.inputs.DEVICE_PATH }}"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Cloned device tree to: $PWD"

      # Decide lunch target based on branch
      - name: Select Lunch Target
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "11.0" || "${{ github.event.inputs.MANIFEST_BRANCH }}" == "12.1" ]]; then
            echo "LUNCH_TARGET=twrp_${{ github.event.inputs.DEVICE_NAME }}-eng" >> "$GITHUB_ENV"
          else
            echo "LUNCH_TARGET=omni_${{ github.event.inputs.DEVICE_NAME }}-eng" >> "$GITHUB_ENV"
          fi
          echo "BUILD_TARGET_IMAGE=${{ github.event.inputs.BUILD_TARGET }}image" >> "$GITHUB_ENV"

      - name: Building OrangeFox
        working-directory: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -euxo pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "${LUNCH_TARGET}"
          make clean
          # Build adbd + the desired image (matches original intent)
          mka adbd "${BUILD_TARGET_IMAGE}"

      - name: Set Build Date
        shell: bash
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Check if Recovery Exists
        id: chkimg
        working-directory: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          CODENAME='${{ github.event.inputs.DEVICE_NAME }}'
          OUTDIR="out/target/product/${CODENAME}"
          # Find the OrangeFox image produced
          IMG_PATH=$(find "$OUTDIR" -maxdepth 2 -type f -name 'OrangeFox*.img' | head -n1 || true)
          if [[ -n "${IMG_PATH:-}" && -f "$IMG_PATH" ]]; then
            echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
            echo "FILE_PATH=$(dirname "$IMG_PATH")" >> "$GITHUB_ENV"
            echo "IMG_NAME=$(basename "$IMG_PATH")" >> "$GITHUB_ENV"
            md5sum "$IMG_PATH" | awk '{print "MD5_IMG="$1}' >> "$GITHUB_ENV"
            echo "Found image: $IMG_PATH"
          else
            echo "CHECK_IMG_IS_OK=false" >> "$GITHUB_ENV"
            echo "No OrangeFox image found under $OUTDIR"
          fi

      - name: Rename the Recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        working-directory: ${{ env.FILE_PATH }}
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ github.event.inputs.BUILD_TARGET }}" in
            boot)       NEW=boot.img;       echo "RECOVERY_TYPE=boot"        >> "$GITHUB_ENV" ;;
            recovery)   NEW=recovery.img;   echo "RECOVERY_TYPE=recovery"    >> "$GITHUB_ENV" ;;
            vendorboot) NEW=vendor_boot.img;echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV" ;;
            *)          echo "Unknown BUILD_TARGET"; exit 1 ;;
          esac
          mv -v "${IMG_NAME}" "${NEW}"

      - name: Include Recovery Installer
        if: env.CHECK_IMG_IS_OK == 'true' && github.event.inputs.RECOVERY_INSTALLER == 'true'
        working-directory: ${{ env.FILE_PATH }}
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip "${RECOVERY_TYPE}.img"

      - name: Recovery to tar (Samsung Odin)
        if: env.CHECK_IMG_IS_OK == 'true' && github.event.inputs.RECOVERY_TAR == 'true'
        working-directory: ${{ env.FILE_PATH }}
        shell: bash
        run: |
          set -euxo pipefail
          tar -cvf "${RECOVERY_TYPE}.tar" "${RECOVERY_TYPE}.img"

      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
            MD5 (img): ${{ env.MD5_IMG }}

      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
            MD5 (img): ${{ env.MD5_IMG }}

      - name: Run LDCheck (optional)
        if: env.CHECK_IMG_IS_OK == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        run: |
          set -euxo pipefail
          cd tools
          mv -n libneeds "${{ env.FILE_PATH }}/recovery/root/" || true
          mv -n ldcheck "${{ env.FILE_PATH }}/recovery/root/" || true
          cd "${{ env.FILE_PATH }}/recovery/root/" || exit 0
          if [[ -f ./ldcheck ]]; then
            python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d "${{ github.event.inputs.LDCHECK }}"
            echo "LDCheck done."
          else
            echo "ldcheck not present; skipping."
          fi

