name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox Branch
        required: true
        default: "12.1"
        type: choice
        options: ["12.1","11.0"]
      DEVICE_TREE:
        description: Custom Recovery Tree
        required: true
        default: "https://github.com/JoeyKoala07/android_device_nothing_Asteroids"
      DEVICE_TREE_BRANCH:
        description: Custom Recovery Tree Branch
        required: true
        default: "Asteroids-user-14-UKQ1.241011.001-2507171803-release-keys"
      DEVICE_PATH:
        description: Device tree path
        required: true
        default: "device/nothing/Asteroids"
      DEVICE_NAME:
        description: Device codename
        required: true
        default: "Asteroids"
      BUILD_TARGET:
        description: Build target
        required: true
        type: choice
        default: "recovery"
        options: ["boot","recovery","vendorboot"]
      RECOVERY_INSTALLER:
        description: Include recovery installer zip
        type: boolean
        required: true
        default: true
      RECOVERY_TAR:
        description: Release recovery.tar for Samsung
        type: boolean
        required: false
        default: false
      LDCHECK:
        description: Path of blobs to check
        required: false
        default: "system/bin/qseecomd"

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clean-up runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Set up OrangeFox manifest
        if: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"
          git config --global user.name "JoeyKoala07"
          git config --global user.email "no-reply@example.com"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"

      - name: Clone device tree
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          git clone "${{ github.event.inputs.DEVICE_TREE }}" -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" "./${{ github.event.inputs.DEVICE_PATH }}"
          cd "${{ github.event.inputs.DEVICE_PATH }}"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Choose lunch/mka command
        id: fox_branch
        uses: haya14busa/action-cond@v1
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
          if_true: lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
          if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image

      - name: Building OrangeFox
        shell: bash -e -o pipefail
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"

          echo "[pwd] $(pwd)"
          test -f build/envsetup.sh || { echo "Missing build/envsetup.sh"; exit 2; }
          test -d "${{ github.event.inputs.DEVICE_PATH }}" || { echo "Missing device path: ${{ github.event.inputs.DEVICE_PATH }}"; find device -maxdepth 3 -type d; exit 2; }

          # disable 'set -u' only while sourcing envsetup.sh
          set +u
          source build/envsetup.sh
          set -u || true

          export ALLOW_MISSING_DEPENDENCIES=true

          test -f "${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh" || {
            echo "Expected vendorsetup.sh at ${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh"; exit 3;
          }

          ${{ steps.fox_branch.outputs.value }}

      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Locate built images
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          prod="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          if ls "$prod"/OrangeFox*.img >/dev/null 2>&1; then
            echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
            echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/$prod" >> "$GITHUB_ENV"
            echo "MD5_IMG=$(md5sum "$prod"/OrangeFox*.img | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          else
            echo "No image found under $prod"
            exit 4
          fi

      - name: Rename image
        run: |
          cd "${{ env.FILE_PATH }}/"
          case "${{ github.event.inputs.BUILD_TARGET }}" in
            boot)       mv -f OrangeFox*.img boot.img;         echo "RECOVERY_TYPE=boot"         >> "$GITHUB_ENV" ;;
            recovery)   mv -f OrangeFox*.img recovery.img;     echo "RECOVERY_TYPE=recovery"     >> "$GITHUB_ENV" ;;
            vendorboot) mv -f OrangeFox*.img vendor_boot.img;  echo "RECOVERY_TYPE=vendor_boot"  >> "$GITHUB_ENV" ;;
          esac
        continue-on-error: true

      - name: Include recovery installer (optional)
        if: ${{ github.event.inputs.RECOVERY_INSTALLER }}
        run: |
          cd "${{ env.FILE_PATH }}/"
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip "${{ env.RECOVERY_TYPE }}.img"
        continue-on-error: true

      - name: Create .tar for Samsung (optional)
        if: ${{ github.event.inputs.RECOVERY_TAR }}
        run: |
          cd "${{ env.FILE_PATH }}/"
          tar -cvf "${{ env.RECOVERY_TYPE }}.tar" "${{ env.RECOVERY_TYPE }}.img"
        continue-on-error: true

      - name: Upload release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: [${{ env.COMMIT_ID }}](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})

      - name: Run LDCheck (best-effort)
        run: |
          cd tools
          mv -n libneeds "${{ env.FILE_PATH }}/recovery/root/" || true
          mv -n ldcheck  "${{ env.FILE_PATH }}/recovery/root/" || true
          cd "${{ env.FILE_PATH }}/recovery/root/" || exit 0
          python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d "${{ github.event.inputs.LDC

